{% extends 'base.html' %}

{% block title %}Nova Encomenda{% endblock %}

{% block content %}
<section class="card">
    <h2>Cadastrar Encomenda</h2>

    <form method="POST" class="form">
        <label>Destinatário</label>
        <input type="text" name="destinatario" required>

        <label>Bloco</label>
        <input type="text" name="bloco" required>

        <label>Apartamento</label>
        <input type="text" name="apartamento" required>

        <label>Descrição</label>
        <input type="text" name="descricao">

        <button type="submit">Salvar Encomenda</button>
    </form>
</section>
{% endblock %}
